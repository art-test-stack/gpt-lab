name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: python-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read versioning files
        id: pyversion
        run: echo "version=$(cat .python-version)" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyversion.outputs.version }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"

      - name: Install Python-only dependencies
        run: uv sync --locked --extra cpu --group dev --no-group rust-dataloader

      - name: Run tests
        run: |
          .venv/bin/python -I -c 'from gpt_lab.rust_tools.dataloader import _extension; assert _extension(required=False) is None'
          .venv/bin/python -m pytest -m "not slow"

  native:
    name: native-dataloader-tests
    runs-on: ubuntu-latest
    env:
      GPT_LAB_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.91.0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
      - name: Configure native test directories
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"
          echo "TIKTOKEN_CACHE_DIR=$RUNNER_TEMP/tiktoken" >> "$GITHUB_ENV"
      - name: Install framework with default dataloader
        run: uv sync --locked --extra cpu --group dev --no-editable
      - name: Cache GPT-2 tokenizer
        run: .venv/bin/python -c 'from gpt_lab.tokenizer import Tokenizer; Tokenizer.from_pretrained("gpt2", source="tiktoken")'
      - name: Run installed backend parity and resume tests
        run: |
          project_root="$PWD"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$project_root/.venv/bin/python" -m pytest -q \
            --basetemp "$RUNNER_TEMP/native-pytest" \
            "$project_root/tests/test_dataloader_parity.py" \
            "$project_root/tests/test_native_dataloader.py" \
            "$project_root/tests/cli/test_cli.py" \
            "$project_root/tests/cli/test_workflows.py"
      - name: Run native exact-pair and I/O retry tests
        run: PYO3_PYTHON="$PWD/.venv/bin/python" cargo test --locked --manifest-path packages/rust-dataloader/Cargo.toml --lib
